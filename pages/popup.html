<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>day1tabs</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <span class="brand-icon">◐</span>
        <span class="brand-name">day1tabs</span>
      </div>
      <div class="reset-toggle" id="resetToggle" title="Toggle auto-reset">
        <div class="toggle-track">
          <div class="toggle-thumb"></div>
        </div>
      </div>
    </div>

    <!-- Tab Count -->
    <div class="tab-count-section">
      <div class="tab-count" id="tabCount">0</div>
      <div class="tab-label" id="tabLabel">tabs open</div>
      <div class="tab-ram" id="tabRam"></div>
      <div class="count-bar" id="countBar"></div>
    </div>

    <!-- Next Reset -->
    <div class="info-row" id="resetInfo">
      <span class="info-icon">🌙</span>
      <span class="info-text" id="resetText">Next reset at midnight</span>
    </div>

    <!-- Undo Banner -->
    <div class="undo-banner" id="undoBanner" style="display: none;">
      <div class="undo-content">
        <span class="undo-text" id="undoText">Undo available</span>
        <button class="undo-btn" id="undoBtn">Undo</button>
      </div>
      <div class="undo-timer" id="undoTimer"></div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="action-btn" id="viewArchive">
        <span class="action-icon">📋</span>
        <span>View Archive</span>
      </button>
      <button class="action-btn" id="manualReset">
        <span class="action-icon">✨</span>
        <span>Fresh Start Now</span>
      </button>
    </div>

    <!-- Never Close Domains -->
    <div class="sacred-section">
      <div class="sacred-toggle" id="sacredToggle">
        <div class="sacred-header">
          <span class="sacred-label">Never Auto-Close</span>
          <span class="sacred-count" id="sacredCount">0 domains</span>
        </div>
        <span class="chevron" id="sacredChevron">›</span>
      </div>
      <div class="sacred-panel" id="sacredPanel" style="display: none;">
        <div class="sacred-hint">Tabs from these domains are kept open during resets.</div>
        <div class="sacred-domains" id="sacredDomains"></div>
        <div class="sacred-add">
          <input type="text" id="sacredInput" placeholder="Add domain (e.g. gmail.com)" spellcheck="false">
          <button class="sacred-add-btn" id="sacredAddBtn">+</button>
        </div>
      </div>
    </div>

    <!-- Settings -->
    <div class="settings-section">
      <div class="settings-toggle" id="settingsToggle">
        <span>Settings</span>
        <span class="chevron" id="settingsChevron">›</span>
      </div>
      <div class="settings-panel" id="settingsPanel" style="display: none;">
        <div class="setting-row">
          <label>Reset time</label>
          <div class="time-picker-group">
            <div class="time-picker">
              <select id="resetHourDisplay"></select>
              <span class="time-sep">:</span>
              <select id="resetMinute"></select>
              <select id="resetAmPm">
                <option value="AM">AM</option>
                <option value="PM">PM</option>
              </select>
            </div>
            <span class="time-tz" id="timeTz"></span>
          </div>
        </div>
        <input type="hidden" id="resetHour" value="0">
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <a class="coffee-link" href="https://buymeacoffee.com/alwaysarafath" target="_blank">☕ Buy me a coffee</a>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>
</html>
